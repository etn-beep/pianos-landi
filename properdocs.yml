site_name: Tech-Piano
site_url: "https://tech-piano.com"
site_description: "Documentación técnica del piano: mecánica, acústica científica, afinación, inarmonicidad, historia, pianos japoneses, sistemas silent y consejos de compra."

use_directory_urls: true
edit_uri: ""

theme:
  name: material
  language: es
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Mode clair
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mode sombre
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.highlight

markdown_extensions:
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/ruffle-config.js
  - javascripts/ruffle.js

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: fr
          name: Français
          default: false
          build: true
          nav_translations:
            Home: Accueil
            Mechanics: Mécanique
            Acoustics: Acoustique
            Tuning: Accordage
            History: Histoire
            Japanese Pianos: Pianos Japonais
            Silent: Silent
            Dampp-Chaser: Dampp-Chaser
            Tips: Conseils
            Annexes: Annexes
            Functioning: Fonctionnement
            Japanese Pianos: Pianos Japonais   