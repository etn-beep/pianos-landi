site_name: Tech-Piano
site_url: "https://tech-piano.com"
site_description: "Documentación técnica del piano: mecánica, acústica científica, afinación, inarmonicidad, historia, pianos japoneses, sistemas silent y consejos de compra."

use_directory_urls: true
edit_uri: ""

theme:
  name: material
  language: es
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Mode clair
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mode sombre
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - navigation.instant
    - navigation.prune 

markdown_extensions:
  - footnotes
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/ruffle-config.js
  - javascripts/ruffle.js

plugins:
  - search:
      lang:
        - es
        - fr
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
          nav:
            - Inicio: index.md
            - Historia: historia/index.md
            - Funcionamiento: funcionamiento/index.md
            - Afinacion: afinacion/index.md
            - Acustica: acustica/index.md
            - Consejos: consejos/index.md
            - Pianos japoneses: pianos-japoneses/index.md
            - Silent: silent/index.md
            - Dampp chaser: dampp-chaser/index.md
            - Annexes: annexes/index.md
            
            
            
        - locale: fr
          name: Français
          default: false
          build: true
          nav:
            - Accueil: index.md
            - Histoire: histoire/index.md
            - Fonctionnement: fonctionnement/index.md
            - Accordage: accordage/index.md
            - Acoustique: acoustique/index.md
            - Conseils: conseils/index.md
            - Pianos Japonais: pianos-japonais/index.md
            - Silent: silent/index.md
            - Dampp-Chaser: dampp-chaser/index.md
            - Annexes: annexes/index.md
            

